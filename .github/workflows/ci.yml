name: CI Pipeline - PartsUnlimited

# -------------------------------------------------------------------
# Déclencheur du pipeline
# S’exécute à chaque push ou pull request sur la branche master
# -------------------------------------------------------------------
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  # ===========================================================
  # Étape 1 & 2 : Build et Test
  # ===========================================================
  build_and_test:
    runs-on: windows-latest
    steps:
      # 1. Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Installer le SDK .NET 6
      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      # 3. Restaurer les dépendances
      - name: Restore NuGet packages
        run: dotnet restore PartsUnlimited.sln

      # 4. Build (compilation)
      - name: Build solution
        run: dotnet build PartsUnlimited.sln --configuration Release

      # 5. Tests unitaires
      - name: Run unit tests
        run: dotnet test PartsUnlimited.sln --configuration Release --no-build

  # ===========================================================
  # Étape 3 : Build Docker + Push Docker Hub
  # ===========================================================
  build_docker:
    needs: build_and_test             # Attend que build_and_test soit terminé
    runs-on: ubuntu-latest            # Docker fonctionne nativement sur Linux
    steps:
      # 3.1 : Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v3

      # 3.2 : Connexion à Docker Hub via les secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3.3 : Construire l'image Docker
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/partsunlimited:latest .

      # 3.4 : Pousser l'image Docker sur Docker Hub
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/partsunlimited:latest
