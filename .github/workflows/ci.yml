name: CI Pipeline ASP.NET 4.5

# 🔔 Trigger : lancement automatique sur push dans master
on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      # 1️⃣ Récupérer le code du dépôt
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Compiler la solution ASP.NET 4.5 avec MSBuild
      - name: Build solution
        run: |
          "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe" ^
          PartsUnlimited-aspnet45\PartsUnlimited.sln ^
          /p:Configuration=Release

      # 3️⃣ Exécuter les tests unitaires avec VSTest.Console
      - name: Run Unit Tests
        run: |
          "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\Extensions\TestPlatform\VSTest.Console.exe" ^
          PartsUnlimited-aspnet45\test\PartsUnlimited.UnitTests\PartsUnlimited.UnitTests.csproj

      # 4️⃣ (Optionnel) Exécuter les tests Selenium si nécessaire
      - name: Run Selenium Tests
        run: |
          "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\Extensions\TestPlatform\VSTest.Console.exe" ^
          PartsUnlimited-aspnet45\test\FabrikamFiber.SeleniumTests\FabrikamFiber.SeleniumTests.csproj
