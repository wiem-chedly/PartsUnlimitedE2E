name: CI Pipeline - PartsUnlimited

# Déclencheur : s’exécute à chaque push ou pull request sur master
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:

  # Étape 1 : Build et test
  build_and_test:
    runs-on: windows-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v3

      - name: Installer .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore PartsUnlimited.sln

      - name: Build
        run: dotnet build PartsUnlimited.sln --configuration Release

      - name: Test
        run: dotnet test PartsUnlimited.sln --configuration Release --no-build

  # Étape 2 : Build Docker + Push Docker Hub
  build_docker:
    needs: build_and_test       # ne démarre qu'après la réussite de build_and_test
    runs-on: windows-2019
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/partsunlimited:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/partsunlimited:latest
