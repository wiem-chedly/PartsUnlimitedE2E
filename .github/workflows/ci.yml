name: CI/CD - PartsUnlimitedWeb

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - run: dotnet restore PartsUnlimitedWeb/PartsUnlimitedWeb.csproj
      - run: dotnet build PartsUnlimitedWeb/PartsUnlimitedWeb.csproj --configuration Release
      - run: dotnet test PartsUnlimitedWeb/PartsUnlimitedWeb.csproj --no-build --configuration Release

  docker_build:
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: docker build -t wiemchedly/partsunlimited:latest -f PartsUnlimitedWeb/Dockerfile .
      - run: docker push wiemchedly/partsunlimited:latest
