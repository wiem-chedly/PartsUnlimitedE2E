name: CI Pipeline - PartsUnlimited

on:
  push:
    branches: 
      - master
  pull_request:
    branches:
      - master

jobs:

  # Placeholder (optionnel)
  placeholder:
    runs-on: windows-latest
    steps:
      - name: Trigger OK
        run: echo "Pipeline démarré"

  # Étape 1 & 2 : Build + Test
  build_and_test:
    runs-on: windows-latest
    steps:

      - name: Checkout du dépôt
        uses: actions/checkout@v3

      - name: Installer .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore PartsUnlimited.sln

      - name: Build
        run: dotnet build PartsUnlimited.sln --configuration Release

      - name: Tests
        run: dotnet test PartsUnlimited.sln --configuration Release --no-build

  # Étape 3 : Build Docker + Push Docker Hub sur Windows
build:
  needs: test  # Remplace "test" par le nom du job précédent
  runs-on: windows-latest
  steps:
    # 1️⃣ Récupérer le code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣ Se connecter à Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3️⃣ Construire l’image Docker
    - name: Build Docker image
      shell: powershell
      run: |
        cd PartsUnlimited-aspnet45
        docker build -t $env:DOCKER_USERNAME/partsunlimited:latest .

    # 4️⃣ Pousser l’image sur Docker Hub
    - name: Push Docker image
      shell: powershell
      run: |
        cd PartsUnlimited-aspnet45
        docker push $env:DOCKER_USERNAME/partsunlimited:latest
