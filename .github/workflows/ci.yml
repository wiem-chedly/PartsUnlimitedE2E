name: CI Pipeline - PartsUnlimited

on:
  push:
    branches:
      - master

jobs:
  placeholder:
    runs-on: windows-latest
    steps:
      - name: Trigger OK
        run: echo "Pipeline démarré 🚀"

  build_and_test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Restore NuGet packages
        run: nuget restore PartsUnlimited.sln

      - name: Build the solution
        run: msbuild PartsUnlimited.sln /p:Configuration=Release

      - name: Run tests
        run: |
          "%ProgramFiles(x86)%\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\Extensions\TestPlatform\vstest.console.exe" "**\bin\Release\*test*.dll" || echo "Aucun test trouvé"
