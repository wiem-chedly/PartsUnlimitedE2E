
name: CI/CD - PartsUnlimitedWeb

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      - run: dotnet restore PartsUnlimitedWeb/PartsUnlimitedWeb.csproj
      - run: dotnet build PartsUnlimitedWeb/PartsUnlimitedWeb.csproj --configuration Release
      - run: dotnet test PartsUnlimitedWeb/PartsUnlimitedWeb.csproj --no-build --configuration Release

  docker_build:
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: docker build -t wiemchedly/partsunlimited:latest -f PartsUnlimitedWeb/Dockerfile .
      - run: docker push wiemchedly/partsunlimited:latest

deploy:
  needs: build          # démarre après le job "build"
  runs-on: ubuntu-latest
  steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Deploy to Azure Web App (using publish profile)
      uses: azure/webapps-deploy@v2
      with:
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        app-name: 'partsunlimited-webapp'
        images: 'wiemchedly/partsunlimited:latest'
