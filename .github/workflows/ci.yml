name: CI Pipeline - PartsUnlimited

# Déclencheur du pipeline : push ou pull request sur master
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # -------------------------------
  # Job placeholder (facultatif)
  # -------------------------------
  placeholder:
    runs-on: windows-latest
    steps:
      - name: Trigger OK
        run: echo "Pipeline démarré 🚀"

  # -------------------------------
  # Étape 1 & 2 : Build et Test
  # -------------------------------
  build_and_test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore NuGet packages
        run: dotnet restore PartsUnlimited.sln

      - name: Build solution
        run: dotnet build PartsUnlimited.sln --configuration Release

      - name: Run unit tests
        run: dotnet test PartsUnlimited.sln --configuration Release --no-build

  # -------------------------------
  # Étape 3 : Build Docker + Push Docker Hub
  # -------------------------------
  build_docker:
    needs: build_and_test
    runs-on: ubuntu-latest        # Docker fonctionne sur Linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}   # DOCKER_USERNAME = wiemchedly
          password: ${{ secrets.DOCKER_PASSWORD }}   # DOCKER_PASSWORD = wiemlovemama

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/partsunlimited:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/partsunlimited:latest
