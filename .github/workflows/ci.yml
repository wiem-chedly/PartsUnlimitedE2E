name: CI Pipeline - PartsUnlimited

on:
  push:
    branches: 
      - master
  pull_request:
    branches:
      - master

jobs:

  # Placeholder (optionnel)
  placeholder:
    runs-on: windows-latest
    steps:
      - name: Trigger OK
        run: echo "Pipeline démarré"

  # Étape 1 & 2 : Build + Test
  build_and_test:
    runs-on: windows-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v3

      - name: Installer .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore PartsUnlimited.sln

      - name: Build
        run: dotnet build PartsUnlimited.sln --configuration Release

      - name: Tests
        run: dotnet test PartsUnlimited.sln --configuration Release --no-build

  # Étape 3 : Build Docker + Push Docker Hub sur Linux (GitHub runner)
  build_docker:
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          cd PartsUnlimited-aspnet45
          docker build -t ${{ secrets.DOCKER_USERNAME }}/partsunlimited:latest .

      - name: Push Docker image
        run: |
          cd PartsUnlimited-aspnet45
          docker push ${{ secrets.DOCKER_USERNAME }}/partsunlimited:latest
