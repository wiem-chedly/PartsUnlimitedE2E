name: CI Pipeline - PartsUnlimited

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # Étape 1 : Build & Test sur Windows (MSBuild .NET Framework)
  build_and_test:
    runs-on: windows-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v3

      - name: Installer .NET Framework 4.8 Developer Pack
        uses: microsoft/setup-msbuild@v1

      - name: Restaurer les packages NuGet
        run: nuget restore PartsUnlimited.sln

      - name: Build avec MSBuild
        run: msbuild PartsUnlimited.sln /p:Configuration=Release

      - name: Tests unitaires (si tu en as)
        run: |
          echo "Ajouter vos tests ici si besoin"

  # Étape 2 : Build Docker Linux + Push sur Docker Hub
  build_docker:
    needs: build_and_test
    runs-on: ubuntu-latest   # Linux runner pour Docker Linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: wiemchedly
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t wiemchedly/my-app:${{ github.sha }} .
          docker tag wiemchedly/my-app:${{ github.sha }} wiemchedly/my-app:latest

      - name: Push Docker image
        run: |
          docker push wiemchedly/my-app:${{ github.sha }}
          docker push wiemchedly/my-app:latest
