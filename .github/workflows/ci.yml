name: CI Pipeline - PartsUnlimited

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:

  # Étape 1 : Build & Test avec MSBuild
  build_and_test:
    runs-on: windows-2019
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Installer Visual Studio Build Tools
        uses: microsoft/setup-msbuild@v1

      - name: Build le projet
        run: msbuild PartsUnlimited.sln /p:Configuration=Release

      # Ici tu peux ajouter un step pour exécuter des tests si nécessaire
      # - name: Run Tests
      #   run: vstest.console.exe "test\PartsUnlimited.UnitTests.dll"

  # Étape 2 : Build Docker + Push sur Docker Hub
  build_docker:
    needs: build_and_test
    runs-on: windows-2019
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/partsunlimited:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/partsunlimited:latest
