name: CI Pipeline - PartsUnlimited

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # Petit job placeholder
  placeholder:
    runs-on: windows-latest
    steps:
      - name: Trigger OK
        run: echo "Pipeline démarré"

  # Étape 1 + 2 : Build & Test
  build_and_test:
    runs-on: windows-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v3

      - name: Installer .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Restore
        run: dotnet restore PartsUnlimited.sln

      - name: Build
        run: dotnet build PartsUnlimited.sln --configuration Release

      - name: Tests
        run: dotnet test PartsUnlimited.sln --configuration Release --no-build

  # Étape 3 : Build Docker + Push sur Docker Hub
  build_and_push_docker:      # <-- ici l’indentation corrigée
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -f PartsUnlimited-aspnet45/Dockerfile -t wiemchedly/partsunlimited:${{ github.sha }} PartsUnlimited-aspnet45
          docker tag wiemchedly/partsunlimited:${{ github.sha }} wiemchedly/partsunlimited:latest

      - name: Push Docker image
        run: |
          docker push wiemchedly/partsunlimited:${{ github.sha }}
          docker push wiemchedly/partsunlimited:latest
