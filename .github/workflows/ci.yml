name: CI Pipeline - PartsUnlimited

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  # ===========================
  # ÉTAPE 1 : BUILD & TEST
  # ===========================
  build_and_test:
    runs-on: windows-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v3

      - name: Installer MSBuild (pour .NET Framework)
        uses: microsoft/setup-msbuild@v1

      - name: Restaurer les packages NuGet
        run: nuget restore PartsUnlimited.sln

      - name: Build avec MSBuild
        run: msbuild PartsUnlimited.sln /p:Configuration=Release

      - name: Tests unitaires
        run: echo "Aucun test configuré"


  # ===========================
  # ÉTAPE 2 : DOCKER BUILD + PUSH
  # ===========================
  docker_build_push:
    needs: build_and_test
    runs-on: ubuntu-latest   # DOIT être linux pour docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t wiemchedly/partsunlimited:latest .

      - name: Push Docker image
        run: docker push wiemchedly/partsunlimited:latest
