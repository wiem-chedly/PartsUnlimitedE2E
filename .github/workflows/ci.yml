name: CI Pipeline ASP.NET

# 🔔 Trigger : lancement automatique sur push dans master
on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: windows-latest  # Windows pour ASP.NET
    steps:
      # 1️⃣ Récupérer le code du dépôt
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Installer le SDK .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      # 3️⃣ Restaurer les dépendances de la solution
      - name: Restore dependencies
        run: dotnet restore PartsUnlimited-aspnet45/PartsUnlimited.sln

      # 4️⃣ Compiler la solution en Release
      - name: Build solution
        run: dotnet build PartsUnlimited-aspnet45/PartsUnlimited.sln --configuration Release --no-restore

      # 5️⃣ Exécuter les tests unitaires
      - name: Run Unit Tests
        run: dotnet test PartsUnlimited-aspnet45/test/PartsUnlimited.UnitTests/PartsUnlimited.UnitTests.csproj --no-build --verbosity normal
