name: CI Pipeline - PartsUnlimited ASP.NET 4.5

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  # -------------------------------------------------------------
  # JOB 1 : Build & Test
  # -------------------------------------------------------------
  build_and_test:
    runs-on: windows-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v3

      - name: Installer MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Restaurer les packages NuGet
        run: nuget restore PartsUnlimited.sln

      - name: Build du projet
        run: msbuild PartsUnlimited.sln /p:Configuration=Release

      - name: Vérifier sortie du build
        run: dir PartsUnlimitedWeb

      - name: Tests (Placeholder)
        run: echo "Pas de tests pour ASP.NET 4.5"


  # -------------------------------------------------------------
  # JOB 2 : Build Docker + Push Docker Hub
  # -------------------------------------------------------------
  docker_build:
    needs: build_and_test
    runs-on: windows-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v3

      - name: Installer MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Restaurer NuGet
        run: nuget restore PartsUnlimited.sln

      - name: Rebuild du projet (IMPORTANT pour Docker)
        run: msbuild PartsUnlimited.sln /p:Configuration=Release

      - name: Vérifier sortie du build pour Docker
        run: dir PartsUnlimitedWeb

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🔥 CORRECTION ICI : on précise le chemin du Dockerfile
      - name: Build image Docker Windows
        run: |
          docker build -t wiemchedly/partsunlimited:${{ github.sha }} -f PartsUnlimited-aspnet45/Dockerfile .
          docker tag wiemchedly/partsunlimited:${{ github.sha }} wiemchedly/partsunlimited:latest

      - name: Push image to Docker Hub
        run: |
          docker push wiemchedly/partsunlimited:${{ github.sha }}
          docker push wiemchedly/partsunlimited:latest
