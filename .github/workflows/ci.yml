name: CI Pipeline - PartsUnlimited

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # Étape 1 : Build & Test avec MSBuild sur Windows
  build_and_test:
    runs-on: windows-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v3

      - name: Installer .NET Framework 4.8 Developer Pack
        uses: microsoft/setup-msbuild@v1

      - name: Restaurer les packages NuGet
        run: nuget restore PartsUnlimited.sln

      - name: Build avec MSBuild
        run: msbuild PartsUnlimited.sln /p:Configuration=Release

      - name: Tests unitaires (si tu en as)
        run: |
          # Exemple si tu as un projet de test NUnit ou MSTest
          # msbuild /t:Test PartsUnlimitedTests.csproj /p:Configuration=Release
          echo "Ajouter vos tests ici si besoin"

  # Étape 2 : Build Docker + Push sur Docker Hub (Windows Container)
  build:
  needs: test
  runs-on: ubuntu-latest
  steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: wiemchedly
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build -t wiemchedly/my-app:${{ github.sha }} .
        docker tag wiemchedly/my-app:${{ github.sha }} wiemchedly/my-app:latest

    - name: Push Docker image
      run: |
        docker push wiemchedly/my-app:${{ github.sha }}
        docker push wiemchedly/my-app:latest
