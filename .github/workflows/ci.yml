name: CI Pipeline - PartsUnlimited

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  placeholder:
    runs-on: windows-latest
    steps:
      - name: Trigger OK
        run: echo "Pipeline démarré"

  # --------------------------------------------------------
  # JOB 1 : BUILD + TEST .NET 6
  # --------------------------------------------------------
  build_and_test:
    runs-on: windows-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v3

      - name: Installer .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restaurer les dépendances
        run: dotnet restore PartsUnlimited.sln

      - name: Build du projet
        run: dotnet build PartsUnlimited.sln --configuration Release

      - name: Lancer les tests
        run: dotnet test PartsUnlimited.sln --configuration Release --no-build

  # --------------------------------------------------------
  # JOB 2 : BUILD & PUSH DOCKER IMAGE
  # --------------------------------------------------------
  docker_build:
    needs: build_and_test   # L'étape Docker commence après les tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t wiemchedly/partsunlimited:latest \
            -f PartsUnlimited-aspnet45/Dockerfile .

      - name: Push Docker image
        run: |
          docker push wiemchedly/partsunlimited:latest
