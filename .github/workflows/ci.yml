name: CI Pipeline - PartsUnlimited ASP.NET 4.5

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  # -------------------------------------------------------------
  # JOB 1 : Build & Test (obligatoire)
  # -------------------------------------------------------------
  build_and_test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore PartsUnlimited.sln

      - name: Build solution
        run: dotnet build PartsUnlimited.sln --configuration Release

      - name: Run tests
        run: dotnet test PartsUnlimited.sln --configuration Release --no-build

  # -------------------------------------------------------------
  # JOB 2 : Build Docker + Push
  # -------------------------------------------------------------
  build_docker:
    needs: build_and_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t wiemchedly/partsunlimited:${{ github.sha }} \
            -f PartsUnlimited-aspnet45/Dockerfile \
            PartsUnlimited-aspnet45

      - name: Tag latest
        run: |
          docker tag wiemchedly/partsunlimited:${{ github.sha }} \
                     wiemchedly/partsunlimited:latest

      - name: Push Docker image
        run: |
          docker push wiemchedly/partsunlimited:${{ github.sha }}
          docker push wiemchedly/partsunlimited:latest
